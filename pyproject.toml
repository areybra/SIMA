[project]
name = "sima"
version = "1.0.0"
description = "SIMA - Sistem Interaktif Manajemen Atlet"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<6",
    "django-jazzmin==3.0.5",
    "PyMySQL==1.2.0",
    "cryptography>=41.0.0",
    "dj-database-url==3.1.2",
    "python-dotenv==1.2.3",
    "whitenoise==6.12.0",
    "Pillow>=10.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
